<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ระบบยาสมุนไพร สสจ.ตาก</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --pu:#534AB7;--pul:#EEEDFE;--pud:#3C3489;
  --tl:#1D9E75;--tll:#E1F5EE;
  --am:#BA7517;--aml:#FAEEDA;
  --rd:#E24B4A;--rdl:#FCEBEB;
  --gn:#3B6D11;--gnl:#EAF3DE;
  --gy:#888780;--gyl:#F1EFE8;
  --co:#D85A30;--col:#FAECE7;
  --tx:#2C2C2A;--txm:#5F5E5A;--txh:#B4B2A9;
  --bg:#fff;--bg2:#F1EFE8;--bd:rgba(44,44,42,.12);
  --r:8px;--rl:12px;
}
body{font-family:'Sarabun','Noto Sans Thai',sans-serif;background:var(--bg2);color:var(--tx);font-size:14px;line-height:1.6;}
.hidden{display:none!important;}
#shell{display:flex;min-height:100vh;}
#sb{width:224px;background:var(--bg);border-right:.5px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;}
#main{flex:1;overflow-y:auto;min-width:0;}
.sbh{padding:1rem 1.25rem;border-bottom:.5px solid var(--bd);}
.sbh p{font-size:13px;font-weight:500;}.sbh small{font-size:11px;color:var(--txm);}
.ns{font-size:10px;color:var(--txh);padding:10px 1.25rem 3px;text-transform:uppercase;letter-spacing:.06em;}
.ni{display:flex;align-items:center;gap:8px;padding:8px 1.25rem;font-size:13px;color:var(--txm);cursor:pointer;border:none;background:none;width:100%;text-align:left;}
.ni:hover{background:var(--bg2);color:var(--tx);}.ni.active{background:var(--pul);color:var(--pud);font-weight:500;}
.nic{width:16px;text-align:center;font-size:14px;flex-shrink:0;}
.sbf{margin-top:auto;padding:.875rem 1rem;border-top:.5px solid var(--bd);}
.av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;flex-shrink:0;}
.av.admin{background:var(--pul);color:var(--pud);}
.av.district{background:var(--tll);color:#085041;}
.av.phho{background:var(--col);color:#712B13;}
.rp{font-size:10px;padding:2px 8px;border-radius:99px;}
.rp.admin{background:var(--pul);color:var(--pud);}
.rp.district{background:var(--tll);color:#085041;}
.rp.phho{background:var(--col);color:#712B13;}
.ph{padding:1.1rem 1.5rem;background:var(--bg);border-bottom:.5px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.ph h1{font-size:15px;font-weight:500;}.ph p{font-size:12px;color:var(--txm);}
.pb{padding:1.25rem 1.5rem;}
.card{background:var(--bg);border:.5px solid var(--bd);border-radius:var(--rl);padding:1rem 1.25rem;margin-bottom:1rem;}
.ct{font-weight:500;font-size:14px;margin-bottom:12px;}
.mg{display:grid;gap:10px;margin-bottom:1rem;}
.mg.c4{grid-template-columns:repeat(4,minmax(0,1fr));}
.mg.c3{grid-template-columns:repeat(3,minmax(0,1fr));}
.mg.c2{grid-template-columns:repeat(2,minmax(0,1fr));}
.mt{background:var(--bg2);border-radius:var(--r);padding:.875rem;}
.mt label{font-size:11px;color:var(--txm);display:block;margin-bottom:3px;}
.mv{font-size:17px;font-weight:500;}.ms{font-size:11px;color:var(--txh);margin-top:1px;}
.ok{color:var(--tl);}.warn{color:var(--am);}.danger{color:var(--rd);}
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{text-align:left;padding:7px 10px;color:var(--txm);font-weight:500;border-bottom:.5px solid var(--bd);white-space:nowrap;}
.tbl td{padding:8px 10px;border-bottom:.5px solid var(--bd);vertical-align:middle;}
.tbl tr:last-child td{border-bottom:none;}
.tbl .num{text-align:right;}.tbl .ctr{text-align:center;}
.pbw{background:var(--bg2);border-radius:3px;height:7px;min-width:80px;}
.pbf{height:7px;border-radius:3px;}
.pbf.ok{background:var(--pu);}.pbf.warn{background:var(--am);}.pbf.danger{background:var(--rd);}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;font-weight:500;}
.badge.ok{background:var(--gnl);color:var(--gn);}
.badge.warn{background:var(--aml);color:var(--am);}
.badge.danger{background:var(--rdl);color:#791F1F;}
.badge.info{background:var(--pul);color:var(--pud);}
.badge.gray{background:var(--gyl);color:var(--gy);}
.badge.coral{background:var(--col);color:#712B13;}
.fg{margin-bottom:.875rem;}
.fg label{font-size:12px;color:var(--txm);display:block;margin-bottom:5px;}
input,select,textarea{width:100%;padding:8px 10px;border:.5px solid var(--bd);border-radius:var(--r);font-family:inherit;font-size:13px;color:var(--tx);background:var(--bg);outline:none;}
input:focus,select:focus,textarea:focus{border-color:var(--pu);}
input[readonly]{background:var(--bg2);color:var(--txm);}
textarea{min-height:60px;resize:vertical;}
.fgrid{display:grid;gap:10px;}
.fgrid.c2{grid-template-columns:1fr 1fr;}
.fgrid.c3{grid-template-columns:1fr 1fr 1fr;}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:var(--r);border:.5px solid var(--bd);background:var(--bg);font-family:inherit;font-size:13px;color:var(--tx);cursor:pointer;}
.btn:hover{background:var(--bg2);}
.btn.pri{background:var(--pu);color:#fff;border-color:var(--pu);}
.btn.pri:hover{background:var(--pud);}
.btn.suc{background:var(--gnl);color:var(--gn);border-color:var(--tl);}
.btn.dan{background:var(--rdl);color:#791F1F;border-color:var(--rd);}
.btn.sm{padding:4px 10px;font-size:12px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.brow{display:flex;gap:8px;flex-wrap:wrap;}.brow.r{justify-content:flex-end;}
.al{padding:10px 14px;border-radius:var(--r);font-size:13px;margin-bottom:.875rem;}
.al.warn{background:var(--aml);color:var(--am);}
.al.danger{background:var(--rdl);color:#791F1F;}
.al.ok{background:var(--gnl);color:var(--gn);}
.al.info{background:var(--pul);color:var(--pud);}
#lp{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg2);}
.lc{background:var(--bg);border:.5px solid var(--bd);border-radius:var(--rl);padding:2rem;width:100%;max-width:360px;}
.ll{text-align:center;margin-bottom:1.5rem;}
.ll .ico{width:52px;height:52px;border-radius:50%;background:var(--pul);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-size:22px;}
#toast{position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:6px;}
.tm{background:var(--tx);color:#fff;padding:9px 14px;border-radius:var(--r);font-size:13px;max-width:300px;}
.tm.ok{background:#27500A;}.tm.err{background:#791F1F;}.tm.warn{background:#633806;}
.ndot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--rd);margin-left:4px;vertical-align:middle;}
</style>
</head>
<body>

<div id="lp">
  <div class="lc">
    <div class="ll">
      <div class="ico">🌿</div>
      <p style="font-weight:500;font-size:15px;">ระบบยาสมุนไพร สสจ.ตาก</p>
      <small style="color:var(--txm);">โรงพยาบาลบ้านตาก</small>
    </div>
    <div class="fg"><label>ชื่อผู้ใช้</label><input id="iu" type="text" autocomplete="username"></div>
    <div class="fg"><label>รหัสผ่าน</label><input id="ip" type="password" autocomplete="current-password"></div>
    <div id="le" class="al danger hidden"></div>
    <button id="lbtn" class="btn pri" style="width:100%;justify-content:center;" onclick="doLogin()">เข้าสู่ระบบ</button>
    <p style="font-size:11px;color:var(--txh);text-align:center;margin-top:10px;">ลืมรหัสผ่าน? ติดต่อผู้ดูแลระบบ รพ.บ้านตาก</p>
  </div>
</div>

<div id="shell" class="hidden">
  <nav id="sb">
    <div class="sbh"><p>ระบบยาสมุนไพร สสจ.ตาก</p><small id="fy-label">—</small></div>

    <div class="ns">ภาพรวม</div>
    <button class="ni active" onclick="go('dashboard')"><span class="nic">📊</span>Dashboard</button>
    <button class="ni" onclick="go('budget')"><span class="nic">💰</span>Budget Tracker</button>
    <button class="ni" onclick="go('notifications')"><span class="nic">🔔</span>แจ้งเตือน<span id="nd" class="ndot hidden"></span></button>

    <div class="ns">การดำเนินงาน</div>
    <button class="ni" onclick="go('demand')"><span class="nic">📋</span>แผนความต้องการ</button>
    <button class="ni ni-admin" onclick="go('production')"><span class="nic">🏭</span>บันทึกการผลิต</button>
    <button class="ni ni-admin" onclick="go('distribution')"><span class="nic">📦</span>การเบิกจ่าย</button>

    <div class="ns">รายงาน</div>
    <button class="ni" onclick="go('report')"><span class="nic">📄</span>รายงานรายเดือน</button>
    <button class="ni ni-adminphho" onclick="go('provincial')"><span class="nic">🗺️</span>รายงานจังหวัด</button>

    <div class="ns ni-admin">จัดการระบบ</div>
    <button class="ni ni-admin" onclick="go('products')"><span class="nic">🌿</span>จัดการยาสมุนไพร</button>
    <button class="ni ni-admin" onclick="go('fiscal')"><span class="nic">📅</span>ปีงบประมาณ</button>
    <button class="ni ni-admin" onclick="go('budgetsettings')"><span class="nic">💵</span>ตั้งงบรายอำเภอ</button>
    <button class="ni ni-admin" onclick="go('users')"><span class="nic">👥</span>จัดการผู้ใช้</button>
    <button class="ni ni-admin" onclick="go('districts')"><span class="nic">🏘️</span>จัดการอำเภอ</button>

    <div class="sbf">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
        <div id="sav" class="av admin">AD</div>
        <div style="min-width:0;">
          <p id="sname" style="font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px;"></p>
          <span id="srole" class="rp admin">admin</span>
        </div>
      </div>
      <button class="btn sm" style="width:100%;justify-content:center;margin-bottom:4px;" onclick="go('changepw')">เปลี่ยนรหัสผ่าน</button>
      <button class="btn sm dan" style="width:100%;justify-content:center;" onclick="doLogout()">ออกจากระบบ</button>
    </div>
  </nav>

  <div id="main">
    <div id="page-dashboard"      class="page hidden"></div>
    <div id="page-budget"         class="page hidden"></div>
    <div id="page-demand"         class="page hidden"></div>
    <div id="page-production"     class="page hidden"></div>
    <div id="page-distribution"   class="page hidden"></div>
    <div id="page-report"         class="page hidden"></div>
    <div id="page-provincial"     class="page hidden"></div>
    <div id="page-notifications"  class="page hidden"></div>
    <div id="page-products"       class="page hidden"></div>
    <div id="page-fiscal"         class="page hidden"></div>
    <div id="page-budgetsettings" class="page hidden"></div>
    <div id="page-users"          class="page hidden"></div>
    <div id="page-districts"      class="page hidden"></div>
    <div id="page-changepw"       class="page hidden"></div>
  </div>
</div>
<div id="toast"></div>

<script>
const S={token:'',user:null,products:[],districts:[],fiscalYears:[],currentFY:null};
const ROLE={ADMIN:'admin',DISTRICT:'district',PHHO:'phho'};

function api(action,data={}){
  return new Promise(resolve=>{
    try{
      google.script.run
        .withSuccessHandler(r=>resolve(typeof r==='string'?JSON.parse(r):r))
        .withFailureHandler(e=>resolve({ok:false,error:e.message||'เรียก server ไม่ได้'}))
        .handleRequest(JSON.stringify({action,token:S.token,data}));
    }catch(e){resolve({ok:false,error:'google.script.run: '+e.message});}
  });
}

// ---- AUTH ----
async function doLogin(){
  const u=document.getElementById('iu').value.trim(),p=document.getElementById('ip').value;
  if(!u||!p){showLE('กรุณากรอกข้อมูลให้ครบ');return;}
  const btn=document.getElementById('lbtn');
  btn.textContent='กำลังเข้าสู่ระบบ...';btn.disabled=true;
  try{
    const r=await api('login',{username:u,password:p});
    if(!r.ok){showLE(r.error||'เข้าสู่ระบบไม่สำเร็จ');return;}
    S.token=r.token;S.user=r.user;
    await loadMaster();
    initApp();
  }finally{btn.textContent='เข้าสู่ระบบ';btn.disabled=false;}
}
function showLE(m){const e=document.getElementById('le');e.textContent=m;e.classList.remove('hidden');}
async function doLogout(){
  await api('logout');S.token='';S.user=null;
  document.getElementById('lp').classList.remove('hidden');
  document.getElementById('shell').classList.add('hidden');
}
async function loadMaster(){
  const [pr,dr,fyr,cfyr]=await Promise.all([api('getProducts',{}),api('getDistricts',{}),api('getFiscalYears'),api('getCurrentFY')]);
  if(pr.ok) S.products=pr.data;
  if(dr.ok) S.districts=dr.data;
  if(fyr.ok) S.fiscalYears=fyr.data;
  if(cfyr.ok){S.currentFY=cfyr.data;if(S.currentFY)document.getElementById('fy-label').textContent='ปีงบ '+S.currentFY.fiscal_year;}
}
function initApp(){
  const u=S.user;
  document.getElementById('lp').classList.add('hidden');
  document.getElementById('shell').classList.remove('hidden');
  document.getElementById('sname').textContent=u.full_name||u.username;
  const rp=document.getElementById('srole');
  const rl={admin:'Admin',district:'District User',phho:'สสจ.ตาก'};
  rp.textContent=rl[u.role]||u.role;rp.className='rp '+u.role;
  const av=document.getElementById('sav');
  av.textContent=(u.full_name||'U').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
  av.className='av '+u.role;
  // Role visibility
  const isAdmin=u.role===ROLE.ADMIN;
  const isAdminPhho=isAdmin||u.role===ROLE.PHHO;
  document.querySelectorAll('.ni-admin').forEach(el=>el.style.display=isAdmin?'':'none');
  document.querySelectorAll('.ni-adminphho').forEach(el=>el.style.display=isAdminPhho?'':'none');
  loadNotifDot();
  go('dashboard');
}

// ---- NAV ----
function go(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));
  document.querySelectorAll('.ni').forEach(b=>b.classList.remove('active'));
  const pg=document.getElementById('page-'+name);if(pg)pg.classList.remove('hidden');
  const btn=document.querySelector(`.ni[onclick="go('${name}')"]`);if(btn)btn.classList.add('active');
  if(pg)render(name,pg);
}
async function render(name,el){
  switch(name){
    case 'dashboard':     return renderDashboard(el);
    case 'budget':        return renderBudget(el);
    case 'demand':        return renderDemand(el);
    case 'production':    return renderProduction(el);
    case 'distribution':  return renderDistribution(el);
    case 'report':        return renderReport(el,false);
    case 'provincial':    return renderReport(el,true);
    case 'notifications': return renderNotif(el);
    case 'products':      return renderProducts(el);
    case 'fiscal':        return renderFiscal(el);
    case 'budgetsettings':return renderBudgetSettings(el);
    case 'users':         return renderUsers(el);
    case 'districts':     return renderDistricts(el);
    case 'changepw':      return renderChangePw(el);
  }
}

// ---- DASHBOARD ----
async function renderDashboard(el){
  el.innerHTML=spin();
  const fyr=S.currentFY?.fy_id||'';
  const r=await api('getDashboard',{fy_id:fyr});
  if(!r.ok){el.innerHTML=err(r.error);return;}
  const d=r.data;
  const fyOpts=S.fiscalYears.map(f=>`<option value="${f.fy_id}" ${f.fy_id==fyr?'selected':''}>${f.fiscal_year}</option>`).join('');
  let dRows='';
  (d.district_summary||[]).forEach(ds=>{
    const cls=ds.pct>80?'danger':ds.pct>50?'warn':'ok';
    dRows+=`<tr>
      <td>${ds.district_name}</td>
      <td class="num">${fmt(ds.quota)}</td>
      <td class="num ok">${fmt(ds.used)}</td>
      <td class="num">${fmt(ds.remaining)}</td>
      <td style="min-width:120px;">
        <div class="pbw"><div class="pbf ${cls}" style="width:${Math.min(ds.pct,100)}%"></div></div>
        <small style="color:var(--txm)">${ds.pct}%</small>
      </td>
      <td class="ctr"><span class="badge ${ds.plan_submitted?'ok':'danger'}">${ds.plan_submitted?'ส่งแล้ว':'ยังไม่ส่ง'}</span></td>
    </tr>`;
  });
  let alerts='';
  if(d.not_submitted?.length) alerts+=`<div class="al warn">ยังไม่ส่งแผน: <strong>${d.not_submitted.join(', ')}</strong></div>`;
  if(d.pending_dist>0) alerts+=`<div class="al info">คำขอเบิกรออนุมัติ <strong>${d.pending_dist} รายการ</strong></div>`;
  el.innerHTML=`<div class="ph">
    <div><h1>Dashboard</h1><p>${thaiDate(new Date())}</p></div>
    <select style="font-size:12px;width:auto;" onchange="refreshDash(this.value)">${fyOpts}</select>
  </div>
  <div class="pb">
    ${alerts}
    <div class="mg c4">
      <div class="mt"><label>งบประมาณรวม</label><div class="mv">${fmt(d.total_quota)}</div><div class="ms">บาท</div></div>
      <div class="mt"><label>เบิกสะสม</label><div class="mv ok">${fmt(d.total_used)}</div><div class="ms">${d.pct}% ของงบ</div></div>
      <div class="mt"><label>คงเหลือ</label><div class="mv">${fmt(d.remaining)}</div><div class="ms">บาท</div></div>
      <div class="mt"><label>ผลิตภัณฑ์ใช้งาน</label><div class="mv">${d.product_count}</div><div class="ms">รายการ</div></div>
    </div>
    <div class="card">
      <div class="ct">โควต้าและการเบิกรายอำเภอ</div>
      <table class="tbl"><thead><tr>
        <th>อำเภอ</th><th class="num">โควต้า (บาท)</th><th class="num">เบิกแล้ว</th>
        <th class="num">คงเหลือ</th><th>% การใช้</th><th class="ctr">แผน Q3</th>
      </tr></thead><tbody>${dRows||ndr(6)}</tbody></table>
    </div>
  </div>`;
}
async function refreshDash(fy_id){
  const el=document.getElementById('page-dashboard');
  const r=await api('getDashboard',{fy_id});if(!r.ok)return;
  go('dashboard'); // re-render; for now simple re-nav
}

// ---- BUDGET TRACKER ----
async function renderBudget(el){
  el.innerHTML=spin();
  const fyr=S.currentFY?.fy_id||'';
  const fyOpts=S.fiscalYears.map(f=>`<option value="${f.fy_id}" ${f.fy_id==fyr?'selected':''}>${f.fiscal_year}</option>`).join('');
  el.innerHTML=`<div class="ph"><div><h1>Budget Tracker</h1><p>โควต้าคงเหลือ real-time</p></div>
    <select id="bt-fy" style="font-size:12px;width:auto;" onchange="loadBT()">${fyOpts}</select></div>
    <div class="pb"><div id="bt-c">${spin()}</div></div>`;
  await loadBT();
}
async function loadBT(){
  const fy_id=document.getElementById('bt-fy')?.value||S.currentFY?.fy_id;
  const r=await api('getBudgetTracker',{fy_id});
  const c=document.getElementById('bt-c');if(!c)return;
  if(!r.ok){c.innerHTML=err(r.error);return;}
  const prods=S.products;
  const ph=prods.map(p=>`<th class="num">${p.product_name.substring(0,16)}<br><small style="font-weight:400">${p.price_per_unit} บ./${p.unit}</small></th>`).join('');
  let rows='';
  (r.data||[]).forEach(d=>{
    const cls=d.pct>80?'danger':d.pct>50?'warn':'ok';
    const bpc=prods.map(p=>{
      const b=(d.by_product||[]).find(x=>x.product_id==p.product_id)||{qty:0,val:0,unit:p.unit};
      return `<td class="num">${b.qty?b.qty.toLocaleString()+' '+b.unit:'-'}<br><small style="color:var(--txh)">${b.val?fmt(b.val)+' บ.':''}</small></td>`;
    }).join('');
    rows+=`<tr><td><strong>${d.district_name}</strong></td><td class="num">${fmt(d.quota)}</td>${bpc}
      <td class="num ok">${fmt(d.used)}</td><td class="num">${fmt(d.remaining)}</td>
      <td><div class="pbw"><div class="pbf ${cls}" style="width:${Math.min(d.pct,100)}%"></div></div><small style="color:var(--txm)">${d.pct}%</small></td>
    </tr>`;
  });
  c.innerHTML=`<div class="card" style="overflow-x:auto;">
    <table class="tbl"><thead><tr>
      <th>อำเภอ</th><th class="num">โควต้า (บาท)</th>${ph}
      <th class="num">รวมเบิก</th><th class="num">คงเหลือ</th><th>%</th>
    </tr></thead><tbody>${rows||ndr(prods.length+4)}</tbody></table></div>`;
}

// ---- DEMAND ----
async function renderDemand(el){
  el.innerHTML=spin();
  const fyr=S.currentFY?.fy_id||'';
  const r=await api('getDemandPlans',{fy_id:fyr});
  if(!r.ok){el.innerHTML=err(r.error);return;}
  const plans=r.data||[],isAdmin=S.user.role===ROLE.ADMIN;
  const sl={draft:'ร่าง',submitted:'รออนุมัติ',approved:'อนุมัติแล้ว',rejected:'ปฏิเสธ'};
  const sc={draft:'gray',submitted:'warn',approved:'ok',rejected:'danger'};
  const fyOpts=S.fiscalYears.map(f=>`<option value="${f.fy_id}" ${f.fy_id==fyr?'selected':''}>${f.fiscal_year}</option>`).join('');
  const dOpts=S.districts.map(d=>`<option value="${d.district_id}">${d.district_name}</option>`).join('');
  const pOpts=S.products.map(p=>`<option value="${p.product_id}">${p.product_name} (${p.price_per_unit} บ./${p.unit})</option>`).join('');
  let rows='';
  plans.slice().reverse().forEach(p=>{
    const prod=S.products.find(x=>x.product_id==p.product_id);
    const dist=S.districts.find(x=>x.district_id==p.district_id);
    rows+=`<tr>
      <td>${fyLabel(p.fy_id)} Q${p.quarter}</td>
      ${isAdmin?`<td>${dist?.district_name||p.district_id}</td>`:''}
      <td>${prod?.product_name||p.product_id}</td>
      <td class="num">${parseInt(p.quantity_requested||0).toLocaleString()} ${prod?.unit||''}</td>
      <td class="num">${fmt(p.total_value)}</td>
      <td class="ctr"><span class="badge ${sc[p.status]||'gray'}">${sl[p.status]||p.status}</span></td>
      <td class="ctr" style="white-space:nowrap;">
        ${isAdmin&&p.status==='submitted'?`<button class="btn sm suc" onclick="reviewPlan(${p.plan_id},true)">อนุมัติ</button>
          <button class="btn sm dan" onclick="reviewPlan(${p.plan_id},false)">ปฏิเสธ</button>`:''}
      </td>
    </tr>`;
  });
  el.innerHTML=`<div class="ph"><div><h1>แผนความต้องการ</h1></div></div>
  <div class="pb">
    <div class="al warn">deadline ส่งแผน: <strong>17 เม.ย. ของทุกปี</strong></div>
    <div class="card">
      <div class="ct">กรอกความต้องการใหม่</div>
      <div class="fgrid c3">
        <div class="fg"><label>ปีงบประมาณ</label><select id="dp-fy">${fyOpts}</select></div>
        <div class="fg"><label>ไตรมาส</label>
          <select id="dp-q"><option value="1">Q1 (ต.ค.–ธ.ค.)</option><option value="2">Q2 (ม.ค.–มี.ค.)</option>
          <option value="3" selected>Q3 (เม.ย.–มิ.ย.)</option><option value="4">Q4 (ก.ค.–ก.ย.)</option></select>
        </div>
        ${isAdmin?`<div class="fg"><label>อำเภอ</label><select id="dp-d">${dOpts}</select></div>`:
          `<div class="fg"><label>อำเภอ</label><input value="${distName(S.user.district_id)||''}" readonly></div>`}
      </div>
      <div class="fgrid c2">
        <div class="fg"><label>ผลิตภัณฑ์</label><select id="dp-p" onchange="calcDem()">${pOpts}</select></div>
        <div class="fg"><label>จำนวน</label><input type="number" id="dp-qty" value="1000" min="1" step="100" oninput="calcDem()"></div>
      </div>
      <div class="fg"><label>หมายเหตุ / วัตถุประสงค์</label><textarea id="dp-rem"></textarea></div>
      <div class="al info" id="dp-calc">—</div>
      <div class="brow r">
        <button class="btn" onclick="saveDemand('draft')">บันทึกร่าง</button>
        <button class="btn pri" onclick="saveDemand('submit')">ส่งคำขอ</button>
      </div>
    </div>
    <div class="card">
      <div class="ct">รายการแผนทั้งหมด</div>
      <table class="tbl"><thead><tr>
        <th>ปีงบ/ไตรมาส</th>${isAdmin?'<th>อำเภอ</th>':''}<th>ผลิตภัณฑ์</th>
        <th class="num">จำนวน</th><th class="num">มูลค่า (บาท)</th>
        <th class="ctr">สถานะ</th><th></th>
      </tr></thead><tbody>${rows||ndr(isAdmin?7:6)}</tbody></table>
    </div>
  </div>`;
  calcDem();
}
function calcDem(){
  const sel=document.getElementById('dp-p'),qty=parseInt(document.getElementById('dp-qty')?.value)||0;
  if(!sel)return;
  const prod=S.products.find(p=>p.product_id==sel.value);if(!prod)return;
  const val=qty*parseFloat(prod.price_per_unit);
  const c=document.getElementById('dp-calc');
  if(c)c.textContent=`มูลค่า: ${fmt(val)} บาท (${qty.toLocaleString()} ${prod.unit} × ${prod.price_per_unit} บาท)`;
}
async function saveDemand(mode){
  const did=S.user.role===ROLE.DISTRICT?S.user.district_id:document.getElementById('dp-d')?.value||S.user.district_id;
  const r=await api('saveDemandPlan',{district_id:did,
    product_id:document.getElementById('dp-p').value,
    fy_id:document.getElementById('dp-fy').value,
    quarter:document.getElementById('dp-q').value,
    quantity_requested:parseInt(document.getElementById('dp-qty').value),
    remarks:document.getElementById('dp-rem').value});
  if(!r.ok){toast(r.error,'err');return;}
  if(mode==='submit'){
    const r2=await api('submitDemandPlan',{plan_ids:[r.plan_id]});
    if(!r2.ok){toast(r2.error,'err');return;}
    toast('ส่งคำขอสำเร็จ','ok');
  }else toast('บันทึกร่างสำเร็จ','ok');
  go('demand');
}
async function reviewPlan(plan_id,approved){
  const note=approved?'':prompt('เหตุผลที่ปฏิเสธ (ถ้ามี):');
  const r=await api('reviewDemandPlan',{plan_id,approved,review_note:note||''});
  if(r.ok){toast(approved?'อนุมัติแล้ว':'ปฏิเสธแล้ว','ok');go('demand');}
  else toast(r.error,'err');
}

// ---- PRODUCTION ----
async function renderProduction(el){
  el.innerHTML=spin();
  const fyr=S.currentFY?.fy_id||'';
  const m=new Date().getMonth()+1;
  const fyOpts=S.fiscalYears.map(f=>`<option value="${f.fy_id}" ${f.fy_id==fyr?'selected':''}>${f.fiscal_year}</option>`).join('');
  const months=[...Array(12)].map((_,i)=>`<option value="${i+1}" ${i+1==m?'selected':''}>${TM[i]}</option>`).join('');
  const r=await api('getProduction',{fy_id:fyr});
  if(!r.ok){el.innerHTML=err(r.error);return;}
  const recs=r.data||[];
  const rows=S.products.map(p=>{
    const rec=recs.find(x=>x.product_id==p.product_id&&x.month==m)||{};
    const pln=parseInt(rec.plan_quantity||0),act=parseInt(rec.actual_quantity||0);
    const pct=pln?Math.round(act/pln*100):0;
    const cls=pct>=100?'ok':pct>=80?'warn':'danger';
    return `<tr>
      <td>${p.product_name}</td>
      <td class="ctr">${p.price_per_unit} บ./${p.unit}</td>
      <td class="ctr"><input type="number" class="pp" data-pid="${p.product_id}" value="${pln}" min="0" step="100" style="width:90px;text-align:center;"></td>
      <td class="ctr"><input type="number" class="pa" data-pid="${p.product_id}" value="${act}" min="0" step="100" style="width:90px;text-align:center;"></td>
      <td class="ctr"><span class="badge ${cls}">${pct?pct+'%':'—'}</span></td>
      <td class="num">${fmt(act*parseFloat(p.price_per_unit))}</td>
    </tr>`;
  }).join('');
  el.innerHTML=`<div class="ph"><div><h1>บันทึกการผลิต</h1><p>Admin เท่านั้น</p></div></div>
  <div class="pb"><div class="card">
    <div class="fgrid c2" style="max-width:300px;margin-bottom:1rem;">
      <div class="fg"><label>ปีงบ</label><select id="pr-fy">${fyOpts}</select></div>
      <div class="fg"><label>เดือน</label><select id="pr-m">${months}</select></div>
    </div>
    <table class="tbl"><thead><tr>
      <th>ผลิตภัณฑ์</th><th class="ctr">ราคา</th><th class="ctr">แผน</th><th class="ctr">จริง</th>
      <th class="ctr">% สำเร็จ</th><th class="num">มูลค่าจริง</th>
    </tr></thead><tbody>${rows}</tbody></table>
    <div class="brow r" style="margin-top:1rem;"><button class="btn pri" onclick="saveAllProd()">บันทึก</button></div>
  </div></div>`;
}
async function saveAllProd(){
  const fy_id=document.getElementById('pr-fy').value,month=document.getElementById('pr-m').value;
  const pp=document.querySelectorAll('.pp'),pa=document.querySelectorAll('.pa');
  for(let i=0;i<pp.length;i++)
    await api('saveProduction',{product_id:pp[i].dataset.pid,fy_id,month,
      plan_quantity:parseInt(pp[i].value)||0,actual_quantity:parseInt(pa[i].value)||0});
  toast('บันทึกการผลิตสำเร็จ','ok');go('production');
}

async function loadReport(){
  const fy_id=document.getElementById('rp-fy').value,month=document.getElementById('rp-m').value;
  const r=await api('getMonthlyReport',{fy_id,month});
  const c=document.getElementById('rp-c');if(!c)return;
  if(!r.ok){c.innerHTML=err(r.error);return;}
  const d=r.data,prods=S.products;
  const ph=prods.map(p=>`<th class="num">${p.product_name.substring(0,14)}<br><small>${p.unit}</small></th><th class="num">บาท</th>`).join('');
  let rA='';
  (d.reportA||[]).forEach(row=>{
    const pc=prods.map(p=>{const b=row.by_product?.[p.product_id]||{qty:0,val:0};
      return `<td class="num">${b.qty||'-'}</td><td class="num">${b.val?fmt(b.val):'-'}</td>`;}).join('');
    rA+=`<tr><td>${row.district_name}</td>${pc}<td class="num ok"><strong>${fmt(row.total)}</strong></td></tr>`;
  });
  let rB='';
  (d.reportB||[]).forEach(row=>{
    const pc=prods.map(p=>{const b=row.by_product?.[p.product_id]||{qty:0,val:0};
      return `<td class="num">${b.qty||'-'}</td><td class="num">${b.val?fmt(b.val):'-'}</td>`;}).join('');
    rB+=`<tr><td>${row.district_name}</td>${pc}<td class="num ok"><strong>${fmt(row.total_acc)}</strong></td></tr>`;
  });
  let rC='';
  (d.reportC||[]).forEach(p=>{
    const cls=p.pct>=100?'ok':p.pct>=80?'warn':'danger';
    rC+=`<tr><td>${p.product_name}</td>
      <td class="num">${(p.plan||0).toLocaleString()} ${p.unit}</td>
      <td class="num">${(p.actual||0).toLocaleString()}</td>
      <td class="num">${(p.requested||0).toLocaleString()}</td>
      <td class="ctr"><span class="badge ${cls}">${p.pct}%</span></td>
      <td class="ctr"><span class="badge ${p.meets_demand?'ok':'warn'}">${p.meets_demand?'เพียงพอ':'ไม่เพียงพอ'}</span></td>
    </tr>`;
  });
  c.innerHTML=`
    <div class="card"><div class="ct">ก. มูลค่าที่แต่ละอำเภอใช้ แยกตามชนิดยา</div>
      <div style="overflow-x:auto;"><table class="tbl"><thead><tr>
        <th>อำเภอ</th>${ph}<th class="num">รวม (บาท)</th>
      </tr></thead><tbody>${rA||ndr(prods.length*2+2)}</tbody></table></div></div>
    <div class="card"><div class="ct">ข. มูลค่าที่แต่ละอำเภอเบิกจาก รพ.บ้านตาก (สะสม)</div>
      <div style="overflow-x:auto;"><table class="tbl"><thead><tr>
        <th>อำเภอ</th>${ph}<th class="num">รวมสะสม (บาท)</th>
      </tr></thead><tbody>${rB||ndr(prods.length*2+2)}</tbody></table></div></div>
    <div class="card"><div class="ct">ค. ผลิตจริง vs แผน vs คำขอ แยกตามชนิดยา</div>
      <table class="tbl"><thead><tr>
        <th>ผลิตภัณฑ์</th><th class="num">แผน</th><th class="num">จริง</th>
        <th class="num">คำขอรวม</th><th class="ctr">% สำเร็จ</th><th class="ctr">เพียงพอ</th>
      </tr></thead><tbody>${rC||ndr(6)}</tbody></table></div>
    <div class="brow r"><button class="btn" onclick="toast('กำลังพัฒนา Export Excel','warn')">Export Excel</button></div>`;
}

  const r=await api('setCurrentFY',{fy_id});

async function renderBudgetSettings(el){

// ---- NOTIFICATIONS ----
async function renderNotif(el){
  el.innerHTML=spin();
  const r=await api('getNotifications');
  if(!r.ok){el.innerHTML=err(r.error);return;}
  const ti={deadline_warning:'⚠',quota_low:'⚠',demand_submitted:'📋',
    demand_approved:'✅',demand_rejected:'❌',production_low:'📉'};
  const tc={deadline_warning:'danger',quota_low:'warn',demand_submitted:'info',
    demand_approved:'ok',demand_rejected:'danger',production_low:'warn'};
  const items=(r.data||[]).map(n=>`
    <div style="display:flex;gap:12px;align-items:flex-start;padding:12px 1.25rem;border-bottom:.5px solid var(--bd);opacity:${n.is_read?0.6:1};cursor:pointer;" onclick="markRead(${n.notif_id},this)">
      <div style="width:34px;height:34px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;">${ti[n.type]||'🔔'}</div>
      <div style="flex:1;">
        <div style="display:flex;justify-content:space-between;gap:8px;">
          <p style="font-size:13px;font-weight:${n.is_read?400:500};">${n.title}</p>
          <small style="color:var(--txh);white-space:nowrap;">${thaiDate(new Date(n.created_at))}</small>
        </div>
        <p style="font-size:12px;color:var(--txm);margin-top:2px;">${n.message}</p>
        <div style="margin-top:4px;"><span class="badge ${tc[n.type]||'gray'}">${n.type}</span>
          ${!n.is_read?'<span class="badge info" style="margin-left:4px;">ใหม่</span>':''}
        </div>
      </div>
    </div>`).join('');
  el.innerHTML=`<div class="ph"><div><h1>การแจ้งเตือน</h1>
    <p>${(r.data||[]).filter(n=>!n.is_read).length} รายการยังไม่อ่าน</p></div></div>
  <div class="pb"><div class="card" style="padding:0;">
    ${items||'<p style="padding:24px;text-align:center;color:var(--txh);">ไม่มีการแจ้งเตือน</p>'}
  </div></div>`;
}
async function markRead(notif_id,el){
  await api('markRead',{notif_id});
  if(el)el.style.opacity='0.6';
  loadNotifDot();
}
async function loadNotifDot(){
  const r=await api('getNotifications');
  const n=document.getElementById('nd');
  if(n)n.classList.toggle('hidden',!(r.data||[]).some(x=>!x.is_read));
}

function renderChangePw(el){
  el.innerHTML=`<div class="ph"><div><h1>เปลี่ยนรหัสผ่าน</h1></div></div>
  <div class="pb"><div class="card" style="max-width:400px;">

    <div class="fg"><label>ยืนยันรหัสผ่านใหม่</label><input type="password" id="cp-cfm"></div>
    <div id="cp-err" class="al danger hidden"></div>
    <div class="brow r"><button class="btn pri" onclick="submitChangePw()">เปลี่ยนรหัสผ่าน</button></div>
  </div></div>`;
}
async function submitChangePw(){
  const o=document.getElementById('cp-old').value,n=document.getElementById('cp-new').value;
  const c=document.getElementById('cp-cfm').value,e=document.getElementById('cp-err');
  if(n!==c){e.textContent='รหัสผ่านใหม่ไม่ตรงกัน';e.classList.remove('hidden');return;}
  const r=await api('changePassword',{old_password:o,new_password:n});
  if(r.ok){toast('เปลี่ยนรหัสผ่านสำเร็จ','ok');e.classList.add('hidden');}
  else{e.textContent=r.error;e.classList.remove('hidden');}
}

// ---- UTILS ----
const fmt=n=>Math.round(parseFloat(n)||0).toLocaleString('th-TH');
const thaiDate=d=>{if(!d||isNaN(d))return'—';return d.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'});};
const TM=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const distName=id=>(S.districts.find(d=>d.district_id==id)||{}).district_name||'';
const fyLabel=id=>(S.fiscalYears.find(f=>f.fy_id==id)||{}).fiscal_year||id;
const spin=()=>'<div style="padding:40px;text-align:center;color:var(--txm);">กำลังโหลด...</div>';
const err=m=>`<div class="pb"><div class="al danger">${m}</div></div>`;
const ndr=n=>`<tr><td colspan="${n}" style="text-align:center;color:var(--txh);padding:20px;">ไม่มีข้อมูล</td></tr>`;
function toast(msg,type='ok'){
  const d=document.createElement('div');d.className='tm '+type;d.textContent=msg;
  document.getElementById('toast').appendChild(d);setTimeout(()=>d.remove(),3500);
}
document.addEventListener('DOMContentLoaded',()=>{
  ['iu','ip'].forEach(id=>{const e=document.getElementById(id);if(e)e.addEventListener('keydown',ev=>{if(ev.key==='Enter')doLogin();});});
});
